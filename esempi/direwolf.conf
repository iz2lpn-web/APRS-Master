# Configurazione minima di Direwolf da usare con Ricezione APRS (sorgente "Direwolf o TNC esterno").
# Avvio:  direwolf -c direwolf.conf
# Poi nel pannello scegli "Direwolf o TNC esterno", indirizzo 127.0.0.1, porta 8001.

# Scheda audio a cui è collegata la radio.
#   Windows: numero del dispositivo come lo elenca Direwolf all'avvio, es.  ADEVICE 1
#   Linux:   es.  ADEVICE plughw:1,0      (vedi l'elenco con:  arecord -l)
ADEVICE plughw:1,0
ARATE 48000

CHANNEL 0
# Nominativo: serve solo per trasmettere; per la sola ricezione può restare così.
MYCALL N0CALL
MODEM 1200

# Porta KISS su TCP a cui si collega Ricezione APRS
KISSPORT 8001
AGWPORT 8000
